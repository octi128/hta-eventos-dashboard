<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Eventos HTA · Métricas</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f2ee;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #590782;
    --accent-ink: #ffffff;
    --accent-wash: rgba(89,7,130,0.08);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --funnel-1: #1c5cab;
    --funnel-2: #2a78d6;
    --funnel-3: #5598e7;
    --funnel-4: #86b6ef;
    --good: #0ca30c;
    --good-ink: #006300;
    --critical: #d03b3b;
    --critical-ink: #b42727;
    --warning: #fab219;
    --tooltip-bg: #0b0b0b;
    --tooltip-ink: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232321;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #c9a3f0;
      --accent-ink: #1a0a26;
      --accent-wash: rgba(201,163,240,0.12);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --funnel-1: #9ec5f4;
      --funnel-2: #6da7ec;
      --funnel-3: #3987e5;
      --funnel-4: #256abf;
      --good-ink: #0ca30c;
      --critical-ink: #e66767;
      --tooltip-bg: #f0efec;
      --tooltip-ink: #0b0b0b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #c9a3f0;
    --accent-ink: #1a0a26;
    --accent-wash: rgba(201,163,240,0.12);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --funnel-1: #9ec5f4;
    --funnel-2: #6da7ec;
    --funnel-3: #3987e5;
    --funnel-4: #256abf;
    --good-ink: #0ca30c;
    --critical-ink: #e66767;
    --tooltip-bg: #f0efec;
    --tooltip-ink: #0b0b0b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .ink-2 { color: var(--ink-2); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--ink-2);
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 7px; cursor: pointer;
  }
  .seg button:hover { background: var(--accent-wash); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; }
  .toggle input { accent-color: var(--accent); margin: 0; }
  .btn { appearance: none; font: inherit; font-size: 13px; cursor: pointer; border-radius: 10px; padding: 7px 12px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .btn:hover { background: var(--accent-wash); }
  .btn:disabled { opacity: .5; cursor: progress; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin-bottom: 20px; overflow-x: auto; }
  .tabs button {
    appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 15px;
    color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs .badge { display: inline-block; margin-left: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--critical); vertical-align: middle; }

  /* Cards */
  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .section { margin-top: 28px; }
  .section > .section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }

  .tile .label { font-size: 13px; color: var(--ink-2); }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
  .tile .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tile.hero .value { font-size: 48px; line-height: 1.05; }

  /* Funnel */
  .funnel { display: flex; flex-direction: column; gap: 14px; }
  .fx { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 18px; }
  .fx-side { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding-right: 6px; }
  .fx-kicker { font-size: 13px; color: var(--ink-2); }
  .fx-hero { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .fx-sub { font-size: 13px; color: var(--ink-2); }
  .fx-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .fx-col { position: relative; padding: 0 8px 0 10px; min-width: 0; }
  .fx-strip { height: 5px; border-radius: 3px; margin-bottom: 10px; }
  .fx-name { font-size: 13px; line-height: 1.3; color: var(--ink-2); min-height: 34px; }
  .fx-val { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; }
  .fx-val .muted { font-size: 12px; font-weight: 400; margin-left: 4px; }
  .fx-band { position: relative; height: 200px; margin: 6px 0 4px; }
  .fx-band svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fx-rates { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 26px; }
  .fx-rate { justify-self: start; transform: translateX(-50%); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .fx-rate.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-ink); }
  .fx-rate.warn { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--ink); }
  .fx-rate.bad { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--critical-ink); }
  .fx-rate.mute { background: var(--surface-2); color: var(--muted); }
  .fx-note { font-size: 12px; color: var(--muted); margin-top: 10px; }

  .mbar { height: 6px; min-width: 70px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .mbar i { display: block; height: 100%; background: var(--accent); }
  .ads-strip { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .ads-strip h3 { font-size: 14px; margin-bottom: 8px; }
  .upcoming { list-style: none; padding: 0; margin: 0; font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }

  /* Charts */
  .chart { width: 100%; position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .baseline { stroke: var(--axis); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .xhair { stroke: var(--axis); stroke-width: 1; }

  /* Tables */
  .tablewrap { overflow-x: auto; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: 0; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }

  /* A/B */
  .ab { display: flex; flex-direction: column; gap: 16px; }
  .status { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); margin-bottom: 14px; }
  .status .icon { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
  .status.bad .icon { background: var(--critical); }
  .status.ok .icon { background: var(--good); }
  .status.wait .icon { background: var(--muted); }
  .status strong { display: block; font-size: 14px; }
  .status.bad strong { color: var(--critical-ink); }
  .status.ok strong { color: var(--good-ink); }
  .status p { font-size: 13px; color: var(--ink-2); }
  .verdict { font-size: 15px; margin-bottom: 16px; }
  .verdict b { font-weight: 600; }
  .splitbar { display: flex; gap: 2px; height: 14px; margin: 6px 0 8px; }
  .splitbar span { height: 100%; min-width: 2px; }
  .splitbar span:first-child { border-radius: 4px 0 0 4px; }
  .splitbar span:last-child { border-radius: 0 4px 4px 0; }
  .splitbar span:only-child { border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; }
  .cmp { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .cmp .row { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13px; }
  .cmp .bar { height: 18px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .cmp .track { display: flex; align-items: center; gap: 8px; }
  .sublabel { font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  details.older { margin-top: 4px; }
  details.older > summary { cursor: pointer; color: var(--ink-2); font-size: 14px; padding: 6px 0; }
  details.older[open] > summary { margin-bottom: 12px; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .pill.live { background: var(--accent-wash); color: var(--accent); font-weight: 600; }

  /* Diagnóstico */
  .insights { display: flex; flex-direction: column; gap: 10px; }
  .insight { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .insight .icon { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; margin-top: 1px; }
  .insight.critical .icon { background: var(--critical); }
  .insight.warning .icon { background: var(--warning); color: #0b0b0b; }
  .insight.info .icon { background: var(--series-1); }
  .insight.good .icon { background: var(--good); }
  .insight strong { display: block; font-size: 14px; font-weight: 600; }
  .insight p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .insight .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 2px; }
  .insight.critical .tag { color: var(--critical-ink); }
  .insight.warning .tag { color: var(--ink-2); }
  .insight.info .tag, .insight.good .tag { color: var(--muted); }
  .rbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .rbar i { display: block; height: 8px; border-radius: 0 3px 3px 0; background: var(--series-1); min-width: 2px; }
  .rbar i.bad { background: var(--critical); }
  .flag { color: var(--critical-ink); font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  /* Versiones del test */
  .versions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin: 4px 0 18px; }
  .version { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
  .version.lead { border-color: var(--good); box-shadow: 0 0 0 1px var(--good) inset; }
  .version .shot { display: block; aspect-ratio: 390 / 520; background: var(--surface-2); overflow: hidden; border-bottom: 1px solid var(--border); }
  .version .shot img { width: 100%; display: block; }
  .version .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .version .name { display: flex; align-items: center; gap: 8px; font-weight: 600; flex-wrap: wrap; }
  .version .desc { font-size: 13px; color: var(--ink-2); }
  .version .warn { font-size: 12px; color: var(--critical-ink); font-weight: 600; }
  .version .nums { display: flex; gap: 14px; font-size: 13px; margin-top: 2px; flex-wrap: wrap; }
  .version .nums b { display: block; font-size: 18px; font-weight: 600; }
  .version .nums span { color: var(--muted); font-size: 12px; }
  .version .links { display: flex; gap: 12px; font-size: 13px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .version .links a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .version .links a:hover { text-decoration: underline; }
  .badge-s { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
  .badge-s.win { background: var(--good); color: #fff; }
  .badge-s.lead { background: var(--accent-wash); color: var(--good-ink); border: 1px solid var(--good); }
  .badge-s.bad { background: var(--surface-2); color: var(--critical-ink); }
  .badge-s.mute { background: var(--surface-2); color: var(--muted); }
  .summary-row { cursor: pointer; }
  .summary-row:hover td { background: var(--accent-wash); }

  /* Tooltip */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .08s;
    background: var(--tooltip-bg); color: var(--tooltip-ink); font-size: 12px; line-height: 1.4;
    padding: 8px 10px; border-radius: 8px; max-width: 260px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  #tip.on { opacity: 1; }
  #tip b { font-weight: 600; }

  /* Gate & states */
  .gate { max-width: 360px; margin: 12vh auto 0; }
  .gate form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
  .gate input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .gate button { font: inherit; font-weight: 600; padding: 10px 12px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .err { color: var(--critical-ink); font-size: 13px; }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); }
  .notes { margin-top: 32px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  @media (max-width: 900px) {
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g2 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .tile.hero .value { font-size: 36px; }
    .tile .value { font-size: 24px; }
    .fx { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .fx-hero { font-size: 36px; }
    .fx-val { font-size: 18px; }
    .fx-val .muted { display: block; margin: 2px 0 0; }
    .fx-name { font-size: 12px; }
    .top { align-items: stretch; }
  }

  /* ===== Rediseño de presentación (v2): textos más grandes, jerarquía clara y gráficos ===== */
  :root { --tone-good: var(--good); --tone-warn: var(--warning); --tone-bad: var(--critical); --tone-info: var(--accent); }
  body { font-size: 15px; }
  .wrap { max-width: 1180px; padding: 32px 20px 80px; }
  .top h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; }
  .eyebrow { font-size: 13px !important; }
  .small { font-size: 14px; }
  .card { padding: 24px; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12); }
  .card.big { padding: 26px; }
  .card h3 { font-size: 17px; }
  .card-sub { margin-top: 22px; }
  .card-sub h3 { font-size: 16px; margin-bottom: 4px; }
  .block { margin-top: 22px; }
  .block-h { font-size: 17px; margin: 26px 0 12px; }
  .sublabel { font-size: 13px; color: var(--ink-2); margin: 18px 0 10px; font-weight: 600; }
  .note { font-size: 13px; color: var(--ink-2); margin-top: 14px; }

  /* Selector de evento: tres tarjetas grandes */
  .ev-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 26px; }
  .ev-card { appearance: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px;
    padding: 20px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--border); transition: border-color .15s, box-shadow .15s; }
  .ev-card:hover { border-color: var(--accent); }
  .ev-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .ev-name { font-size: 15px; font-weight: 600; color: var(--ink-2); }
  .ev-big { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-top: 4px; }
  .ev-lbl { font-size: 14px; color: var(--ink-2); }
  .ev-row { font-size: 14px; margin-top: 6px; color: var(--ink); }
  .ev-card .chip { align-self: flex-start; margin-top: 10px; }

  /* Chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .chip.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-ink); }
  .chip.warn { background: color-mix(in srgb, var(--warning) 26%, transparent); color: var(--ink); }
  .chip.bad { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--critical-ink); }
  .chip.info { background: var(--accent-wash); color: var(--accent); }
  .chip.mute { background: var(--surface-2); color: var(--muted); }

  /* Resumen */
  .summary { border-left: 5px solid var(--accent); margin-bottom: 18px; }
  .summary h3 { margin-bottom: 10px; }
  .plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .plain li { font-size: 16px; line-height: 1.5; padding-left: 26px; position: relative; }
  .plain li::before { content: "→"; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
  .plain b { color: var(--ink); }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 30px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; border-top: 5px solid var(--axis);
    display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .kpi.good { border-top-color: var(--good); }
  .kpi.warn { border-top-color: var(--warning); }
  .kpi.bad { border-top-color: var(--critical); }
  .kpi.info { border-top-color: var(--accent); }
  .kpi-l { font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .kpi-v { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .kpi-s { font-size: 13px; color: var(--ink-2); }

  /* Secciones numeradas */
  .sec { margin-top: 40px; }
  .sec-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .sec-num { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .sec-head h2 { font-size: 24px; line-height: 1.2; letter-spacing: -0.01em; }
  .sec-head p { font-size: 15px; color: var(--ink-2); margin-top: 4px; max-width: 760px; }

  /* Barras horizontales */
  .hbars { display: flex; flex-direction: column; gap: 14px; }

  .hbar-l { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; font-size: 14px; min-width: 0; overflow: hidden; }
  .hbar-l > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hbar-l .chip { flex: none; }
  .hbar-t { height: 22px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .hbar-t i { display: block; height: 100%; border-radius: 6px; min-width: 4px; }
  .hbar-t i.good { background: var(--good); }
  .hbar-t i.warn { background: var(--warning); }
  .hbar-t i.bad { background: var(--critical); }
  .hbar-t i.info { background: var(--accent); }
  .hbar-v { font-size: 16px; font-weight: 700; text-align: right; }
  .legend2 { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
  .legend2 i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend2 i.good { background: var(--good); } .legend2 i.warn { background: var(--warning); }
  .legend2 i.bad { background: var(--critical); } .legend2 i.pending { background: var(--axis); }

  /* Columnas verticales (emails) */
  .vbars { display: flex; align-items: flex-end; gap: 10px; height: 230px; padding-top: 10px; }
  .vb { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vb-v { font-size: 14px; font-weight: 700; height: 18px; }
  .vb-t { flex: 1; width: 100%; max-width: 64px; background: var(--surface-2); border-radius: 8px 8px 4px 4px; display: flex; align-items: flex-end; overflow: hidden; }
  .vb-t i { display: block; width: 100%; border-radius: 8px 8px 4px 4px; }
  .vb-t i.good { background: var(--good); } .vb-t i.warn { background: var(--warning); }
  .vb-t i.bad { background: var(--critical); } .vb-t i.pending { background: var(--axis); }
  .vb-l { font-size: 13px; color: var(--ink-2); font-weight: 600; }

  /* Próximos envíos */
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .tl { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; font-size: 14px; padding: 10px 14px; background: var(--surface-2); border-radius: 10px; }
  .tl-d { color: var(--ink-2); }
  .tl-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Ideas / diagnósticos */
  .ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .idea { display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--axis); }
  .idea.critical { border-left-color: var(--critical); }
  .idea.warning { border-left-color: var(--warning); }
  .idea.good { border-left-color: var(--good); }
  .idea.info { border-left-color: var(--accent); }
  .idea-ic { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #fff; background: var(--accent); }
  .idea.critical .idea-ic { background: var(--critical); }
  .idea.warning .idea-ic { background: var(--warning); color: #0b0b0b; }
  .idea.good .idea-ic { background: var(--good); }
  .idea strong { display: block; font-size: 15px; font-weight: 600; margin-top: 2px; }
  .idea p { font-size: 14px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
  .idea .tag { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }

  /* Anuncios / bloque de texto */
  .ads-strip { display: none; }
  .mono { font-size: 13px; }

  /* Test A/B: banner y tarjetas */
  .banner { border-radius: 16px; padding: 22px 24px; margin-bottom: 18px; border: 1px solid var(--border); background: var(--surface); border-left: 6px solid var(--axis); }
  .banner strong { display: block; font-size: 20px; line-height: 1.25; }
  .banner p { font-size: 16px; line-height: 1.55; margin-top: 8px; color: var(--ink); }
  .banner.good { border-left-color: var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface)); }
  .banner.bad { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 7%, var(--surface)); }
  .banner.info { border-left-color: var(--accent); background: var(--accent-wash); }
  .banner.mute { border-left-color: var(--axis); }
  .vcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .vcard { display: grid; grid-template-columns: 110px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .vcard.win { border: 2px solid var(--good); }
  .vshot { display: block; background: var(--surface-2); }
  .vshot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; min-height: 200px; }
  .vbody { padding: 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .vtop { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; font-size: 16px; }
  .vdesc { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
  .warn-txt { font-size: 13px; color: var(--critical-ink); font-weight: 600; }
  .vbig { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; margin-top: 6px; }
  .vbig span { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-top: 6px; }
  .vgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
  .vgrid div { background: var(--surface-2); border-radius: 10px; padding: 8px; }
  .vgrid b { display: block; font-size: 17px; }
  .vgrid span { font-size: 12px; color: var(--ink-2); }
  .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; margin-top: auto; padding-top: 6px; }

  /* Detalles plegables */
  details.more { margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--accent); }
  details.more[open] summary { margin-bottom: 12px; }
  details.more .sublabel:first-of-type { margin-top: 12px; }

  /* Conexión Brevo */
  .connect { background: var(--surface); border: 1px dashed var(--border); border-radius: 16px; padding: 22px 24px; font-size: 15px; }
  .connect strong { display: block; font-size: 17px; margin-bottom: 8px; }
  .connect ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }

  /* Glosario */
  .glossary { margin-top: 40px; }
  .glossary dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 22px; margin: 12px 0 0; font-size: 14px; }
  .glossary dt { font-weight: 700; }
  .glossary dd { margin: 0; color: var(--ink-2); }

  /* Tablas y textos más legibles */
  table { font-size: 14px; }
  th { font-size: 12px; }
  td, th { padding: 10px 10px; }

  @media (max-width: 900px) {
    .ev-cards { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .hbar { grid-template-columns: minmax(0, 1fr) 60px; }
    .hbar-l { grid-column: 1 / -1; }
    .hbar-t { grid-column: 1; }
  }
  @media (max-width: 560px) {
    .top h1 { font-size: 26px; }
    .kpi-v { font-size: 30px; }
    .ev-big { font-size: 34px; }
    .sec-head h2 { font-size: 20px; }
    .vcard { grid-template-columns: 1fr; }
    .vshot img { min-height: 0; height: 180px; }
    .vbars { height: 190px; gap: 6px; }
    .vb-l { font-size: 11px; }
    .tl { grid-template-columns: 1fr; gap: 2px; }
    .glossary dl { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Cargando…</div></div>
<div id="tip" role="tooltip"></div>

<script>
const TOKEN_STORE = "hta-dash-token";
const EMAIL_STORE = "hta-dash-email";
const PREF_STORE = "hta-dash-prefs";
const SERIES = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];
const STEP_LABELS = [
  ["visitors", "Visitantes", "vieron la landing"],
  ["submitters", "Formulario", "enviaron el formulario"],
  ["typ", "Página de gracias", "llegaron a typ-evento"],
  ["confirmed", "Confirmación", "llegaron a confirmación"],
];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let prefs = { days: 14, paid: false, event: "hollywood" };
try { Object.assign(prefs, JSON.parse(store.get(PREF_STORE) || "{}")); } catch {}
const savePrefs = () => store.set(PREF_STORE, JSON.stringify(prefs));

let data = null, loading = false, lastError = null;
const app = document.getElementById("app");
const tip = document.getElementById("tip");

const nf = new Intl.NumberFormat("es-AR");
const fmt = (n) => nf.format(Math.round(n || 0));
const pct = (n, d = 1) => (n == null || !isFinite(n)) ? "—" : (n * 100).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d }) + "%";
const rate = (a, b) => (b ? a / b : null);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dateFmt = (iso, opts) => new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z").toLocaleString("es-AR", { timeZone: "America/Argentina/Buenos_Aires", ...opts });
const dayLabel = (d) => { const [y, m, dd] = d.split("-"); return `${+dd}/${+m}`; };

/* ---------- Tooltip ---------- */
function showTip(html, x, y) {
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
const hideTip = () => tip.classList.remove("on");
document.addEventListener("scroll", hideTip, { passive: true });

/* ---------- Data ---------- */
async function load(fresh = false) {
  const token = store.get(TOKEN_STORE);
  if (!token) return renderGate();
  loading = true; lastError = null; render();
  try {
    const res = await fetch(`/api/metrics?days=${prefs.days}${fresh ? "&fresh=1" : ""}`, { headers: { Authorization: `Bearer ${token}` } });
    if (res.status === 401) { store.del(TOKEN_STORE); data = null; return renderGate("Tu sesión venció. Volvé a entrar."); }
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || body.error || res.statusText);
    data = body;
  } catch (e) {
    lastError = e.message;
  } finally {
    loading = false; render();
  }
}

function renderGate(msg) {
  app.innerHTML = `
    <div class="gate card">
      <div class="brand"><span class="eyebrow">Highway Trading Academy</span><h1>Métricas de eventos</h1></div>
      <form id="gate">
        <label class="small ink-2" for="em">Email</label>
        <input id="em" type="email" autocomplete="username" required autofocus value="${esc(store.get(EMAIL_STORE) || "")}">
        <label class="small ink-2" for="pw">Contraseña</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        ${msg ? `<p class="err">${esc(msg)}</p>` : ""}
        <button type="submit">Entrar</button>
      </form>
    </div>`;
  document.getElementById("gate").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    btn.disabled = true; btn.textContent = "Entrando…";
    const email = document.getElementById("em").value, password = document.getElementById("pw").value;
    try {
      const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
      const body = await res.json();
      if (!res.ok) return renderGate(body.error || "No se pudo entrar.");
      store.set(TOKEN_STORE, body.token); store.set(EMAIL_STORE, body.email);
      load();
    } catch { renderGate("No se pudo conectar. Probá de nuevo."); }
  });
}

/* ---------- Analysis helpers ---------- */
function sampleNeeded(p1, p2) {
  // Visitantes por variante para detectar la diferencia observada (95% confianza, 80% potencia)
  if (p1 == null || p2 == null || p1 === p2) return null;
  const n = Math.pow(1.96 + 0.84, 2) * (p1 * (1 - p1) + p2 * (1 - p2)) / Math.pow(p1 - p2, 2);
  return isFinite(n) ? Math.ceil(n) : null;
}

function analyzeTest(t, seg) {
  const variants = t.variants;
  const control = variants.find((v) => v.isControl) || variants[0];
  const others = variants.filter((v) => v !== control);
  const cr = (v) => rate(v[seg].submitters, v[seg].visitors);
  let best = null;
  for (const v of others) {
    const c = v.vsControl && v.vsControl[seg];
    if (!c) continue;
    if (!best || c.confidence > best.cmp.confidence) best = { v, cmp: c };
  }
  if (t.srm && t.srm.broken) {
    const split = variants.map((v) => `${v.label} ${pct(v.share, 0)}`).join(" / ");
    return {
      kind: "bad", status: "broken",
      title: "Reparto roto: los resultados no son válidos",
      body: `El test está configurado para repartir parejo, pero el tráfico real es ${split}. Con esta diferencia, cualquier comparación de conversión está sesgada. Si recrear el test no lo corrige, el problema es de Framer: reportalo a su soporte o hacé el test desde Meta, con cada versión en su propia URL.`,
      verdict: null,
    };
  }
  if (!best) return { kind: "wait", status: "nodata", title: "Sin datos suficientes", body: "Todavía no hay visitantes en todas las variantes.", verdict: null };
  const pc = cr(control), pv = cr(best.v);
  const leader = pv > pc ? best.v : control, trailer = leader === control ? best.v : control;
  const conf = best.cmp.confidence;
  const relDiff = Math.abs(rate(cr(leader) - cr(trailer), cr(trailer)) ?? 0);
  if (conf >= 0.95) {
    return {
      kind: "ok", status: "winner", leader, trailer, conf,
      title: "Reparto parejo · hay ganador",
      body: "El tráfico se reparte como está configurado y la diferencia es estadísticamente significativa.",
      verdict: `<b>${esc(leader.label)} gana:</b> convierte ${pct(cr(leader))} contra ${pct(cr(trailer))} de ${esc(trailer.label)} (${pct(relDiff, 0)} más), con <b>${pct(conf)}</b> de confianza.`,
    };
  }
  const need = sampleNeeded(pc, pv);
  const have = Math.min(control[seg].visitors, best.v[seg].visitors);
  const remaining = need ? Math.max(0, need - have) : null;
  return {
    kind: "ok", status: "leading", leader, trailer, conf,
    title: "Reparto parejo · todavía sin ganador",
    body: "El tráfico se reparte como está configurado. Falta volumen para que la diferencia sea concluyente.",
    verdict: `<b>${esc(leader.label)} va adelante:</b> ${pct(cr(leader))} contra ${pct(cr(trailer))} de ${esc(trailer.label)}, con ${pct(conf)} de confianza (hace falta 95%).` +
      (remaining ? ` Si la diferencia se mantiene, faltan unos <b>${fmt(remaining)}</b> visitantes más por variante.` : ""),
  };
}

/* ---------- Charts ---------- */
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

function colChart(el, rows, { value, label, tipFn, color = "var(--series-1)", format = fmt }) {
  const W = Math.max(280, el.clientWidth), H = 180, padL = 40, padR = 8, padT = 10, padB = 24;
  const max = niceMax(Math.max(...rows.map(value), 0));
  const iw = W - padL - padR, ih = H - padT - padB;
  const band = iw / Math.max(rows.length, 1);
  const bw = Math.min(24, Math.max(4, band - 4));
  const y = (v) => padT + ih - (v / max) * ih;
  const ticks = [0, max / 2, max];
  const every = Math.ceil(rows.length / Math.floor(iw / 44));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  for (const t of ticks) s += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${format(t)}</text>`;
  rows.forEach((r, i) => {
    const v = value(r), x = padL + band * i + (band - bw) / 2, top = y(v), h = padT + ih - top;
    if (h > 0) {
      const rr = Math.min(4, h, bw / 2);
      s += `<path d="M${x},${padT + ih} V${top + rr} Q${x},${top} ${x + rr},${top} H${x + bw - rr} Q${x + bw},${top} ${x + bw},${top + rr} V${padT + ih} Z" fill="${color}"/>`;
    }
    if (i % every === 0) s += `<text x="${padL + band * i + band / 2}" y="${H - 6}" text-anchor="middle">${label(r)}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${padL + band * i}" y="${padT}" width="${band}" height="${ih}"/>`;
  });
  s += `<line class="baseline" x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}"/></svg>`;
  el.innerHTML = s;
  el.querySelectorAll(".hit").forEach((h) => {
    h.addEventListener("pointermove", (e) => showTip(tipFn(rows[+h.dataset.i]), e.clientX, e.clientY));
    h.addEventListener("pointerleave", hideTip);
  });
}

function lineChart(el, rows, { value, label, tipFn, color = "var(--series-1)", format = (v) => pct(v, 0) }) {
  const W = Math.max(280, el.clientWidth), H = 180, padL = 40, padR = 12, padT = 10, padB = 24;
  const vals = rows.map(value);
  const max = niceMax(Math.max(...vals.filter((v) => v != null), 0.01));
  const iw = W - padL - padR, ih = H - padT - padB;
  const step = rows.length > 1 ? iw / (rows.length - 1) : 0;
  const x = (i) => padL + (rows.length > 1 ? step * i : iw / 2);
  const y = (v) => padT + ih - (v / max) * ih;
  const every = Math.ceil(rows.length / Math.floor(iw / 44));
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">`;
  for (const t of [0, max / 2, max]) s += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${format(t)}</text>`;
  s += `<line class="baseline" x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}"/>`;
  let d = "", area = "", started = false, firstX = 0, lastX = 0;
  vals.forEach((v, i) => {
    if (v == null) { started = false; return; }
    d += `${started ? "L" : "M"}${x(i)},${y(v)} `;
    if (!started && !area) firstX = x(i);
    lastX = x(i); started = true;
  });
  const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
  if (pts.length > 1) s += `<path d="M${pts[0][0]},${padT + ih} ${pts.map((p) => `L${p[0]},${p[1]}`).join(" ")} L${pts[pts.length - 1][0]},${padT + ih} Z" fill="${color}" opacity="0.1"/>`;
  s += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  rows.forEach((r, i) => { if (i % every === 0) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${label(r)}</text>`; });
  const last = pts[pts.length - 1];
  if (last) s += `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<line class="xhair" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" visibility="hidden"/><circle class="xdot" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  s += `<rect class="hit" x="${padL}" y="${padT}" width="${iw}" height="${ih}"/></svg>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), hair = svg.querySelector(".xhair"), dot = svg.querySelector(".xdot"), hit = svg.querySelector(".hit");
  hit.addEventListener("pointermove", (e) => {
    const box = svg.getBoundingClientRect();
    const px = (e.clientX - box.left) * (W / box.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(rows.length > 1 ? (px - padL) / step : 0)));
    hair.setAttribute("x1", x(i)); hair.setAttribute("x2", x(i)); hair.setAttribute("visibility", "visible");
    if (vals[i] != null) { dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(vals[i])); dot.setAttribute("visibility", "visible"); } else dot.setAttribute("visibility", "hidden");
    showTip(tipFn(rows[i]), e.clientX, e.clientY);
  });
  hit.addEventListener("pointerleave", () => { hair.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); hideTip(); });
}

/* ---------- Views ---------- */
function funnelView(f) {
  const max = f.visitors || 1;
  const steps = STEP_LABELS.map(([k, name, desc], i) => {
    const val = f[k], prev = i ? f[STEP_LABELS[i - 1][0]] : null;
    const r = i && prev ? rate(val, prev) : null;
    return { name, desc, val, prev, r, prevName: i ? STEP_LABELS[i - 1][1] : null };
  });
  const healthOf = (s) => s.r == null || s.val > s.prev ? "mute" : s.r >= 0.5 ? "good" : s.r >= 0.2 ? "warn" : "bad";
  const colorOf = { good: "var(--good)", warn: "var(--warning)", bad: "var(--critical)", mute: "var(--axis)" };
  // Cuello de botella: el paso con menor conversión entre dos pasos consecutivos válidos.
  const valid = steps.filter((s) => s.r != null && s.val <= s.prev);
  const bn = valid.reduce((a, s) => (!a || s.r < a.r ? s : a), null);

  const H = 200, mid = H / 2;
  const hOf = (v) => 40 + 160 * Math.log(1 + v) / Math.log(1 + max);
  const X = (i) => 250 * i;
  let shapes = "";
  steps.forEach((s, i) => {
    const next = steps[i + 1] || s;
    const ha = hOf(s.val), hb = hOf(next.val);
    const x0 = X(i), x1 = i < 3 ? X(i + 1) : 1000, xm = (x0 + x1) / 2;
    shapes += `<path d="M${x0},${mid - ha / 2} C${xm},${mid - ha / 2} ${xm},${mid - hb / 2} ${x1},${mid - hb / 2} L${x1},${mid + hb / 2} C${xm},${mid + hb / 2} ${xm},${mid + ha / 2} ${x0},${mid + ha / 2} Z" fill="url(#fx-grad)"/>`;
  });
  const dividers = [1, 2, 3].map((i) => `<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${H}" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/>`).join("");

  const cols = steps.map((s, i) => {
    const h = healthOf(s);
    const tip = `<b>${s.name}</b><br>${fmt(s.val)} ${s.desc}<br>${pct(rate(s.val, max))} de los visitantes${s.r != null ? `<br>${pct(s.r)} del paso anterior` : ""}`;
    return `<div class="fx-col" data-tip="${esc(tip)}">
      <div class="fx-strip" style="background:${colorOf[h]}"></div>
      <div class="fx-name">${s.name}</div>
      <div class="fx-val num">${fmt(s.val)}<span class="muted">${i ? pct(rate(s.val, max)) : "100%"}</span></div>
    </div>`;
  }).join("");
  const rates = steps.map((s, i) => {
    if (!i) return `<span></span>`;
    const h = healthOf(s);
    const text = s.r == null || s.val > s.prev ? "—" : `${pct(s.r)} →`;
    const tip = s.val > s.prev
      ? `<b>${s.name}</b><br>Llegaron más personas que el paso anterior: estas llegan directo, sin pasar por ese paso.`
      : `<b>${s.prevName} → ${s.name}</b><br>${pct(s.r)} de los que estaban en el paso anterior`;
    return `<span class="fx-rate ${h}" data-tip="${esc(tip)}">${text}</span>`;
  }).join("");

  const heroTip = bn ? `<b>Cuello de botella</b><br>${bn.prevName} → ${bn.name}: ${pct(bn.r)} pasa al siguiente paso` : "";
  return `<div class="fx">
    <div class="fx-side">
      <div class="fx-kicker">Cuello de botella</div>
      <div class="fx-hero num" ${bn ? `data-tip="${esc(heroTip)}"` : ""}>${bn ? pct(bn.r) : "—"}</div>
      <div class="fx-sub">${bn ? `${bn.prevName} → ${bn.name}` : "Sin datos suficientes"}</div>
    </div>
    <div>
      <div class="fx-cols">${cols}</div>
      <div class="fx-band">
        <svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="fx-grad" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="var(--accent)" stop-opacity="0.18"/>
            <stop offset="1" stop-color="var(--accent)" stop-opacity="0.9"/>
          </linearGradient></defs>
          ${shapes}${dividers}
        </svg>
      </div>
      <div class="fx-rates">${rates}</div>
      <p class="fx-note">Escala logarítmica: el alto de cada banda sigue la cantidad, pero las diferencias grandes se achican para que se vean todos los pasos.</p>
    </div>
  </div>`;
}

function sourcesTable(sources) {
  const label = (s) => ({ fb: "Facebook (pago)", ig: "Instagram (pago)", an: "Audience Network (pago)", "(directo)": "Directo / sin UTM" }[s] || s);
  return `<div class="tablewrap"><table>
    <thead><tr><th>Fuente</th><th>Visitantes</th><th>Formulario</th><th>Conv.</th><th>Gracias</th><th>Confirmación</th><th>Conv. final</th></tr></thead>
    <tbody>${sources.map((s) => `<tr>
      <td>${esc(label(s.source))}</td><td>${fmt(s.visitors)}</td><td>${fmt(s.submitters)}</td><td>${pct(rate(s.submitters, s.visitors))}</td>
      <td>${fmt(s.typ)}</td><td>${fmt(s.confirmed)}</td><td>${pct(rate(s.confirmed, s.visitors), 2)}</td></tr>`).join("")}</tbody>
  </table></div>`;
}

const shotUrl = (pageId) => `/variants/${pageId}.jpg`;

/* ---------- Diagnóstico ---------- */
const DEVICE = { mobile: "Celular", desktop: "Computadora", tablet: "Tablet" };
const BROWSER = { safari: "Safari", chrome: "Chrome", other: "otro navegador / app", edge: "Edge", firefox: "Firefox" };
const segLabel = (s) => `${DEVICE[s.device] || s.device} · ${BROWSER[s.browser] || s.browser}`;
const SOURCE = { fb: "Facebook", ig: "Instagram", an: "Audience Network", th: "Threads", msg: "Messenger", "": "sin UTM" };
const shortId = (id) => id ? "…" + id.slice(-6) : "(sin campaña)";
const crate = (g) => rate(g.submitters, g.visitors);

function linkKind(href) {
  if (/terminos|politica|privacidad/i.test(href)) return "legal";
  if (href === "/" || /highwaytradingacademy\.com\/?$/.test(href)) return "home";
  if (href.startsWith("/")) return "other-page";
  return "external";
}

function buildInsights(ev) {
  const d = ev.diagnosis, out = [];
  for (const v of (ev.versions || []).filter((x) => x.warning)) {
    out.push({ kind: "critical", tag: "Error en la landing", title: `${v.label}: ${v.warning}`, body: "Lo ve cualquier persona a la que le toque esa versión del test. Corregilo en Framer antes de sacar conclusiones del test." });
  }
  const flagged = d.campaigns.filter((c) => c.flagged);
  for (const c of flagged) {
    const share = rate(c.visitors, d.total.visitors);
    const an = c.sources.find((x) => x.src === "an" && x.share >= 0.2);
    out.push({
      kind: "critical", tag: "Cuello de botella principal",
      title: `La campaña ${shortId(c.campaign)} trae el ${pct(share, 0)} del tráfico y casi no genera formularios`,
      body: `${fmt(c.visitors)} visitantes y ${fmt(c.submitters)} formularios (${pct(crate(c))}), contra ${pct(c.restRate)} del resto del tráfico. Solo ${pct(rate(c.interacted, c.visitors))} toca algo en la página: entran y se van. ` +
        (an ? `El ${pct(an.share, 0)} viene de Audience Network (apps y sitios de terceros de Meta), que suele traer clics accidentales: excluí esa ubicación. ` : "") +
        "Revisá en Ads Manager el objetivo de optimización (tiene que ser leads o conversiones, no clics o visitas) y las ubicaciones.",
    });
  }
  if (flagged.length) {
    out.push({
      kind: "info", tag: "Tasa de formulario real",
      title: `Sin esa campaña, la landing convierte ${pct(crate(d.clean))} (no ${pct(crate(d.total))})`,
      body: `De ${fmt(d.clean.visitors)} visitantes del resto del tráfico, ${fmt(d.clean.submitters)} enviaron el formulario. La página funciona; el número bajo viene de tráfico que no está interesado.`,
    });
  }
  for (const o of d.outbound) {
    const k = linkKind(o.href);
    if (k === "other-page" && o.visitors >= 5) {
      out.push({
        kind: "critical", tag: "Enlace roto",
        title: `Un enlace de esta landing lleva a ${o.href}`,
        body: `${fmt(o.visitors)} personas hicieron clic y se fueron a otra página. Revisá los botones de la landing: probablemente quedó un link copiado de otro evento.`,
      });
    }
  }
  const legal = d.outbound.filter((o) => linkKind(o.href) === "legal").reduce((s, o) => s + o.visitors, 0);
  if (legal >= 10) {
    out.push({
      kind: "warning", tag: "Fuga",
      title: `${fmt(legal)} personas abrieron términos o privacidad`,
      body: "Esos enlaces sacan a la persona de la landing en la misma pestaña. Conviene que se abran en una pestaña nueva para no perderla en medio del formulario.",
    });
  }
  const best = d.segments.filter((s) => s.visitors >= 100).sort((a, b) => crate(b) - crate(a))[0];
  for (const s of d.segments.filter((x) => x.flagged)) {
    out.push({
      kind: "warning", tag: "Dispositivo",
      title: `En ${segLabel(s)} se convierte ${pct(crate(s))}, contra ${pct(crate(best))} en ${segLabel(best)}`,
      body: `${fmt(s.visitors)} visitantes y ${fmt(s.submitters)} formularios (sin contar campañas con problemas). ` +
        (s.device === "mobile" && s.browser === "chrome" ? "Mayormente Android y el navegador interno de Facebook/Instagram: probá el formulario completo en un Android desde un anuncio." : "Probá el formulario completo en ese dispositivo."),
    });
  }
  const bestAd = d.ads.filter((a) => a.visitors >= 50 && !a.flagged).sort((a, b) => crate(b) - crate(a))[0];
  if (bestAd && crate(bestAd) > crate(d.clean)) {
    out.push({
      kind: "good", tag: "Mejor anuncio",
      title: `El anuncio ${shortId(bestAd.ad)} convierte ${pct(crate(bestAd))}, el mejor de este evento`,
      body: `${fmt(bestAd.visitors)} visitantes, ${fmt(bestAd.submitters)} formularios y ${fmt(bestAd.confirmed)} confirmaciones. Es candidato a recibir más presupuesto.`,
    });
  }
  const bounce = 1 - rate(d.clean.interacted, d.clean.visitors);
  const engagedConv = rate(d.clean.submitters, d.clean.interacted);
  out.push({
    kind: engagedConv >= 0.5 ? "good" : "warning", tag: "Dónde se pierde la gente",
    title: `El ${pct(bounce, 0)} se va sin tocar nada; de los que interactúan, el ${pct(engagedConv, 0)} completa el formulario`,
    body: engagedConv >= 0.5
      ? "El formulario no es el problema: quien empieza, termina. La pérdida está arriba de todo (primer pantallazo, promesa, video). Ahí conviene testear."
      : "Mucha gente interactúa pero no termina el formulario: revisá cantidad de campos, validaciones y velocidad en celular.",
  });
  for (const n of ev.notes || []) out.push({ kind: n.kind || "warning", tag: "Landing", title: n.title, body: n.body || "" });
  return out;
}

const fmtDate = (iso) => new Date(iso).toLocaleString("es-AR", { timeZone: "America/Argentina/Buenos_Aires", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

/* ---------- Presentación: piezas comunes ---------- */
const chip = (tone, text) => `<span class="chip ${tone}">${text}</span>`;
const kpi = (label, value, sub, tone) => `<div class="kpi ${tone}"><span class="kpi-l">${label}</span><span class="kpi-v num">${value}</span><span class="kpi-s">${sub}</span></div>`;
const section = (n, title, sub, body) => `<section class="sec">
  <header class="sec-head"><span class="sec-num">${n}</span><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div></header>
  ${body}</section>`;
const toneOf = (r) => r == null ? "mute" : r >= 0.4 ? "good" : r >= 0.25 ? "warn" : "bad";
const segOf = () => (prefs.paid ? "paid" : "all");

// Paso con menor conversión entre dos pasos consecutivos (el cuello de botella).
function bottleneck(f) {
  let best = null;
  STEP_LABELS.forEach(([k, name], i) => {
    if (!i) return;
    const prevKey = STEP_LABELS[i - 1][0], prev = f[prevKey], val = f[k];
    if (!prev || val > prev) return;
    const r = val / prev;
    if (!best || r < best.r) best = { from: STEP_LABELS[i - 1][1], to: name, r };
  });
  return best;
}

function versionMeta(ev, pageId) {
  return (ev.versions || []).find((v) => v.pageId === pageId) || {};
}

/* ---------- Selector de evento ---------- */
function eventCards() {
  const seg = segOf();
  return `<div class="ev-cards">${data.events.map((e) => {
    const f = e.funnel[seg];
    const t = e.tests[0];
    const a = t ? analyzeTest(t, seg) : null;
    const st = !a ? chip("mute", "Sin test A/B")
      : a.status === "broken" ? chip("bad", "Reparto roto")
      : a.status === "winner" ? chip("good", `Gana ${esc(a.leader.label)}`)
      : a.status === "leading" ? chip("info", `${esc(a.leader.label)} va adelante`)
      : chip("mute", "Sin datos suficientes");
    const active = e.key === prefs.event;
    return `<button type="button" class="ev-card ${active ? "on" : ""}" data-ev="${e.key}" aria-pressed="${active}">
      <span class="ev-name">${esc(e.name)}</span>
      <span class="ev-big num">${fmt(f.visitors)}</span>
      <span class="ev-lbl">visitantes en ${data.range.days} días</span>
      <span class="ev-row">${pct(rate(f.submitters, f.visitors))} completa el formulario</span>
      ${st}
    </button>`;
  }).join("")}</div>`;
}

/* ---------- Resumen en lenguaje simple ---------- */
function plainSummary(ev) {
  const seg = segOf();
  const f = ev.funnel[seg];
  const lines = [];
  if (f.visitors) {
    const per100 = Math.round((100 * f.submitters) / f.visitors);
    lines.push(`De cada 100 personas que llegan a la landing, <b>${per100}</b> completan el formulario.`);
  }
  const b = bottleneck(f);
  if (b) lines.push(`Lo que más frena es <b>${b.from} → ${b.to}</b>: pasa solo el ${pct(b.r)} de la gente.`);

  const adsOk = (ev.diagnosis?.ads || []).filter((a) => a.visitors >= 50 && !a.flagged).sort((x, y) => crate(y) - crate(x));
  if (adsOk.length) {
    const best = adsOk[0];
    const worst = adsOk.length > 1 ? adsOk[adsOk.length - 1] : null;
    lines.push(`El mejor anuncio convierte <b>${pct(crate(best))}</b>${worst ? `; el más flojo, ${pct(crate(worst))}` : ""}.`);
  }
  const flaggedCamps = (ev.diagnosis?.campaigns || []).filter((c) => c.flagged).length;
  if (flaggedCamps) lines.push(`<b>${flaggedCamps}</b> campaña${flaggedCamps > 1 ? "s traen" : " trae"} tráfico que casi no interactúa: revisala en Ads Manager.`);

  const t = ev.tests[0];
  if (t) {
    const a = analyzeTest(t, seg);
    lines.push(a.status === "broken" ? `<b>El test A/B no sirve</b>: el tráfico no se reparte como estaba configurado.`
      : a.status === "winner" ? `En el test A/B <b>${esc(a.leader.label)} gana</b>, con ${pct(a.conf, 0)} de confianza.`
      : a.status === "leading" ? `En el test A/B <b>${esc(a.leader.label)} va adelante</b>, pero todavía no es concluyente.`
      : `El test A/B todavía no tiene datos suficientes.`);
  }
  if (ev.email && ev.email.sequence) {
    const ready = ev.email.sequence.filter((s) => s.ready && s.sent >= 100);
    if (ready.length) {
      const avg = ready.reduce((acc, s) => acc + (s.openRate || 0), 0) / ready.length;
      lines.push(`Los mails de la secuencia se abren en promedio el <b>${pct(avg, 0)}</b>.`);
    }
  }
  if (!lines.length) return "";
  return `<div class="card summary"><h3>Lo más importante</h3><ul class="plain">${lines.map((l) => `<li>${l}</li>`).join("")}</ul></div>`;
}

function kpis(ev) {
  const seg = segOf();
  const f = ev.funnel[seg];
  const b = bottleneck(f);
  return `<div class="kpis">
    ${kpi("Visitantes", fmt(f.visitors), "personas que llegaron a la landing", "info")}
    ${kpi("Completaron el formulario", pct(rate(f.submitters, f.visitors)), `${fmt(f.submitters)} personas`, "info")}
    ${kpi("Llegaron a la confirmación", fmt(f.confirmed), `${pct(rate(f.confirmed, f.visitors), 2)} de los visitantes`, "good")}
    ${kpi("Mayor freno", b ? pct(b.r) : "—", b ? `${b.from} → ${b.to}` : "sin datos", "bad")}
  </div>`;
}

/* ---------- 2. Anuncios ---------- */
function adsChart(ev) {
  const d = ev.diagnosis;
  if (!d || !d.ads.length) return `<p class="muted">No hay anuncios con tráfico en este período.</p>`;
  const list = d.ads.filter((a) => a.visitors >= 10).sort((a, b) => (crate(b) ?? 0) - (crate(a) ?? 0)).slice(0, 10);
  if (!list.length) return `<p class="muted">Ningún anuncio llegó a 10 visitantes en este período.</p>`;
  const max = Math.max(...list.map((a) => crate(a) || 0), 0.0001);
  const valid = list.filter((a) => !a.flagged && a.visitors >= 50);
  const bestA = valid[0], worstA = valid.length > 1 ? valid[valid.length - 1] : null;
  return `<div class="hbars">${list.map((a) => {
    const r = crate(a) || 0;
    const tone = a.flagged ? "bad" : a === bestA ? "good" : a === worstA ? "warn" : "info";
    const tag = a.flagged ? chip("bad", "Revisar") : a === bestA ? chip("good", "Mejor") : a === worstA ? chip("warn", "Más flojo") : "";
    const tip = `<b>${esc(shortId(a.ad))}</b><br>${fmt(a.visitors)} visitantes · ${fmt(a.submitters)} formularios<br>${fmt(a.confirmed)} confirmaciones`;
    return `<div class="hbar" data-tip="${esc(tip)}">
      <div class="hbar-l"><span class="mono">${esc(shortId(a.ad))}</span>${tag}<span class="muted small">${fmt(a.visitors)} visitantes</span></div>
      <div class="hbar-t"><i class="${tone}" style="width:${(r / max) * 100}%"></i></div>
      <div class="hbar-v num">${pct(r)}</div>
    </div>`;
  }).join("")}</div>
  <p class="note">Conversión = de las personas que llegaron desde el anuncio, cuántas llenaron el formulario. Verde: mejor anuncio. Amarillo: el más flojo. Rojo: campaña con problemas.</p>`;
}

/* ---------- 3. Test A/B ---------- */
function variantDetailTable(t, seg) {
  const cr = (v) => rate(v[seg].submitters, v[seg].visitors);
  return `<div class="tablewrap"><table>
    <thead><tr><th>Variante</th><th>Visitantes</th><th>Formularios</th><th>Conversión</th><th>Confirmaciones</th><th>Diferencia</th><th>Confianza</th></tr></thead>
    <tbody>${t.variants.map((v) => {
      const c = v.vsControl && v.vsControl[seg];
      return `<tr><td>${esc(v.label)}${v.isControl ? " (original)" : ""}</td><td>${fmt(v[seg].visitors)}</td><td>${fmt(v[seg].submitters)}</td>
        <td>${pct(cr(v))}</td><td>${fmt(v[seg].confirmed)}</td>
        <td>${c && c.lift != null ? (c.lift > 0 ? "+" : "") + pct(c.lift, 0) : "base"}</td><td>${c ? pct(c.confidence) : "—"}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function abView(ev) {
  const seg = segOf();
  const [latest, ...older] = ev.tests;
  if (!latest) {
    return `<div class="card"><p class="ink-2">No hay tests A/B con tráfico en esta landing en los últimos 90 días. Esta es la versión publicada:</p>
      <div class="vcards">${(ev.versions || []).map((v) => versionCard(ev, v, null, seg)).join("")}</div></div>`;
  }
  const a = analyzeTest(latest, seg);
  const toneBanner = { broken: "bad", winner: "good", leading: "info", nodata: "mute" }[a.status] || "mute";
  const banner = `<div class="banner ${toneBanner}"><strong>${a.title}</strong><p>${a.verdict || a.body}</p></div>`;
  const cards = `<div class="vcards">${latest.variants.map((v) => {
    const isWin = a.status === "winner" && a.leader === v;
    const isLose = a.status === "winner" && a.leader !== v;
    const badge = a.status === "broken" ? chip("bad", "Sin resultado válido")
      : isWin ? chip("good", "Ganadora")
      : isLose ? chip("mute", "Pierde")
      : a.status === "leading" ? (a.leader === v ? chip("info", "Va adelante") : chip("mute", "Va atrás"))
      : chip("mute", "Sin datos");
    return versionCard(ev, v, badge, seg, isWin);
  }).join("")}</div>`;
  const maxCr = Math.max(...latest.variants.map((v) => rate(v[seg].submitters, v[seg].visitors) || 0), 0.0001);
  const bars = `<div class="hbars">${latest.variants.map((v) => {
    const r = rate(v[seg].submitters, v[seg].visitors) || 0;
    return `<div class="hbar"><div class="hbar-l"><span>${esc(v.label)}</span></div>
      <div class="hbar-t"><i class="${v === a.leader && a.status !== "broken" ? "good" : "info"}" style="width:${(r / maxCr) * 100}%"></i></div>
      <div class="hbar-v num">${pct(r)}</div></div>`;
  }).join("")}</div>`;
  const older_ = older.length ? `<details class="more"><summary>Ver ${older.length} test${older.length > 1 ? "s" : ""} anterior${older.length > 1 ? "es" : ""}</summary>
    ${older.map((t) => `<p class="sublabel">${dateFmt(t.firstTs, { day: "numeric", month: "short" })} → ${dateFmt(t.lastTs, { day: "numeric", month: "short" })} · ${fmt(t.totalVisitors)} visitantes</p>${variantDetailTable(t, seg)}`).join("")}</details>` : "";
  return `${banner}${cards}
    <div class="card-sub"><h3>Conversión a formulario, lado a lado</h3>${bars}</div>
    <details class="more"><summary>Ver tabla completa del test</summary>${variantDetailTable(latest, seg)}</details>
    ${older_}`;
}

function versionCard(ev, v, badge, seg, isWin = false) {
  const meta = versionMeta(ev, v.pageId);
  const s = v[seg] || { visitors: 0, submitters: 0, confirmed: 0 };
  const r = rate(s.submitters, s.visitors);
  return `<div class="vcard ${isWin ? "win" : ""}">
    <a class="vshot" href="${shotUrl(v.pageId)}" target="_blank" rel="noopener" title="Ver captura completa"><img src="${shotUrl(v.pageId)}" alt="${esc(v.label)} en celular" onerror="this.parentNode.style.display='none'"></a>
    <div class="vbody">
      <div class="vtop"><strong>${esc(v.label)}${v.isControl ? ` <span class="muted small">(original)</span>` : ""}</strong>${badge || ""}</div>
      ${meta.desc ? `<p class="vdesc">${esc(meta.desc)}</p>` : ""}
      ${meta.warning ? `<p class="warn-txt">⚠ ${esc(meta.warning)}</p>` : ""}
      <div class="vbig num">${pct(r)}<span>llenan el formulario</span></div>
      <div class="vgrid">
        <div><b class="num">${fmt(s.visitors)}</b><span>visitantes</span></div>
        <div><b class="num">${fmt(s.submitters)}</b><span>formularios</span></div>
        <div><b class="num">${fmt(s.confirmed)}</b><span>confirmaciones</span></div>
      </div>
      ${v.share != null ? `<p class="small muted">Recibe el ${pct(v.share, 0)} del tráfico</p>` : ""}
      <div class="links"><a href="${ev.editorUrl}?node=${encodeURIComponent(v.pageId)}" target="_blank" rel="noopener">Abrir en Framer ↗</a><a href="${ev.publicUrl}" target="_blank" rel="noopener">Ver publicada ↗</a></div>
    </div>
  </div>`;
}

/* ---------- 4. Emails ---------- */
function emailBody(e) {
  const seq = e.sequence;
  if (!seq.length) return `<p class="ink-2">Todavía no se envió ningún mail de esta secuencia.</p>`;
  const ready = seq.filter((s) => s.ready && s.sent >= 1);
  const avgOpen = ready.length ? ready.reduce((t, s) => t + (s.openRate || 0), 0) / ready.length : null;
  const avgClick = ready.length ? ready.reduce((t, s) => t + (s.clickRate || 0), 0) / ready.length : null;
  const bajas = seq.reduce((t, s) => t + s.unsubs, 0);
  const alcance = seq.reduce((t, s) => t + s.sent, 0);
  const kpiRow = `<div class="kpis">
    ${kpi("Mails enviados", fmt(seq.length), "en la secuencia", "info")}
    ${kpi("Personas alcanzadas", fmt(alcance), "suma de envíos", "info")}
    ${kpi("Apertura promedio", avgOpen == null ? "—" : pct(avgOpen, 0), "de los mails ya cerrados", toneOf(avgOpen) === "good" ? "good" : toneOf(avgOpen) === "warn" ? "warn" : avgOpen == null ? "info" : "bad")}
    ${kpi("Bajas", fmt(bajas), bajas ? "personas que dejaron de recibir" : "nadie se dio de baja", bajas ? "warn" : "good")}
  </div>`;
  const cols = seq.map((s) => {
    const h = s.openRate == null ? 4 : Math.max(4, Math.round(s.openRate * 100));
    const tone = !s.ready ? "pending" : toneOf(s.openRate);
    const tip = `<b>G${s.step ?? "?"} · ${esc(s.name)}</b><br>${fmt(s.sent)} enviados<br>${s.ready ? `${pct(s.openRate)} abrieron · ${pct(s.clickRate)} hicieron clic` : "Menos de 24 h: el dato todavía está incompleto"}`;
    return `<div class="vb" data-tip="${esc(tip)}">
      <span class="vb-v num">${s.ready ? pct(s.openRate, 0) : "…"}</span>
      <div class="vb-t"><i class="${tone}" style="height:${h}%"></i></div>
      <span class="vb-l">G${s.step ?? "?"}</span>
    </div>`;
  }).join("");
  const chart = `<p class="sublabel">Cuánta gente abre cada mail</p>
    <div class="vbars">${cols}</div>
    <div class="legend2"><span><i class="good"></i>40% o más</span><span><i class="warn"></i>25% a 40%</span><span><i class="bad"></i>menos de 25%</span><span><i class="pending"></i>menos de 24 h</span></div>`;
  const upcoming = e.upcoming.length
    ? `<p class="sublabel">Próximos envíos programados</p><div class="timeline">${e.upcoming.slice(0, 8).map((u) => `<div class="tl"><span class="tl-d num">${fmtDate(u.scheduledAt)}</span><span class="tl-n">${esc(u.name)}</span></div>`).join("")}</div>`
    : "";
  const ideas = e.suggestions.length
    ? `<h3 class="block-h">Qué mejorar</h3><div class="ideas">${e.suggestions.map((i) => `<div class="idea ${i.kind}"><span class="idea-ic" aria-hidden="true">${{ critical: "!", warning: "!", info: "i", good: "✓" }[i.kind]}</span><div><span class="tag">${esc(i.tag)}</span><strong>${esc(i.title)}</strong><p>${esc(i.body)}</p></div></div>`).join("")}</div>`
    : "";
  const table = `<details class="more"><summary>Ver tabla con todos los mails</summary><div class="tablewrap"><table>
    <thead><tr><th>Mail</th><th>Enviado</th><th>Destinatarios</th><th>Apertura</th><th>Clics</th><th>Bajas</th></tr></thead>
    <tbody>${seq.map((s) => `<tr><td>G${s.step ?? "—"} · ${esc(s.name)}</td><td class="num">${fmtDate(s.sentDate)}</td><td class="num">${fmt(s.sent)}</td>
      <td class="num">${s.ready ? pct(s.openRate) : `<span class="muted">${pct(s.openRate)} · incompleto</span>`}</td><td class="num">${pct(s.clickRate)}</td><td class="num">${fmt(s.unsubs)}</td></tr>`).join("")}</tbody>
  </table></div></details>`;
  return `${kpiRow}<div class="card-sub">${chart}${upcoming}</div>${ideas}${table}
    <p class="note">Las aperturas de Brevo incluyen las precargas de Apple Mail, así que están algo infladas. Sirven para comparar mails entre sí.</p>`;
}

function emailView(ev) {
  let body;
  if (!data.email?.connected) {
    body = `<div class="connect"><strong>Todavía no hay conexión con Brevo.</strong>
      <ol><li>En Brevo, creá una API key con permiso de lectura de campañas.</li>
      <li>En Vercel, agregá la variable <span class="mono">BREVO_API_KEY</span>.</li>
      <li>Hacé un Redeploy. Esta sección se llena sola.</li></ol></div>`;
  } else if (data.email.error) {
    body = `<p class="err">No se pudo leer Brevo: ${esc(data.email.error)}</p>`;
  } else if (!ev.email) {
    body = `<p class="ink-2">No hay campañas de Brevo que coincidan con ${esc(ev.name)}.</p>`;
  } else {
    body = emailBody(ev.email);
  }
  return section(4, "Secuencia de emails", "Los mails que recibe la gente que se anotó: si los abren, si hacen clic y qué conviene cambiar.", body);
}

/* ---------- 5. Diagnóstico ---------- */
function diagnosisView(ev) {
  const d = ev.diagnosis;
  const ins = buildInsights(ev);
  const icon = { critical: "!", warning: "!", info: "i", good: "✓" };
  const bars = (list, label, tipFn) => {
    const max = Math.max(...list.map((x) => crate(x) || 0), 0.0001);
    return `<div class="hbars">${list.map((x) => `<div class="hbar" data-tip="${esc(tipFn(x))}">
      <div class="hbar-l"><span>${esc(label(x))}</span>${x.flagged ? chip("bad", "Revisar") : ""}<span class="muted small">${fmt(x.visitors)} visitantes</span></div>
      <div class="hbar-t"><i class="${x.flagged ? "bad" : "info"}" style="width:${((crate(x) || 0) / max) * 100}%"></i></div>
      <div class="hbar-v num">${pct(crate(x))}</div></div>`).join("")}</div>`;
  };
  const devBars = bars(d.segments, (s) => segLabel(s), (s) => `<b>${esc(segLabel(s))}</b><br>${fmt(s.visitors)} visitantes · ${fmt(s.submitters)} formularios`);
  const campBars = bars(d.campaigns, (c) => shortId(c.campaign), (c) => `<b>${esc(c.campaign || "(sin campaña)")}</b><br>${fmt(c.visitors)} visitantes · ${fmt(c.submitters)} formularios`);
  const outbound = d.outbound.length
    ? `<div class="tablewrap"><table><thead><tr><th>Destino</th><th>Personas</th></tr></thead><tbody>${d.outbound.map((o) => `<tr><td>${linkKind(o.href) === "other-page" ? `<span class="flag">⚠ </span>` : ""}<span class="mono">${esc(o.href.replace(/^https?:\/\//, "").slice(0, 48))}</span></td><td>${fmt(o.visitors)}</td></tr>`).join("")}</tbody></table></div>`
    : `<p class="small muted">Nadie salió por enlaces en este período.</p>`;
  return section(5, "Diagnóstico", "Qué está funcionando, qué no, y qué probar primero.", `
    <div class="ideas">${ins.map((i) => `<div class="idea ${i.kind}"><span class="idea-ic" aria-hidden="true">${icon[i.kind]}</span><div><span class="tag">${esc(i.tag)}</span><strong>${esc(i.title)}</strong><p>${esc(i.body)}</p></div></div>`).join("")}</div>
    <div class="grid g2 block">
      <div class="card-sub"><h3>Dispositivos</h3><p class="small muted">Cuántos de cada tipo completan el formulario.</p>${devBars}</div>
      <div class="card-sub"><h3>Campañas de Meta</h3><p class="small muted">Cuántos de los que llegan desde cada campaña completan el formulario.</p>${campBars}</div>
    </div>
    <details class="more"><summary>Enlaces que sacan a la gente de la página</summary>${outbound}</details>
    <details class="more"><summary>Tabla de anuncios y campañas</summary>${adsTable(d)}</details>`);
}

function adsTable(d) {
  return `<div class="tablewrap"><table>
    <thead><tr><th>Anuncio</th><th>Campaña</th><th>Visitantes</th><th>Formulario</th><th>Conv.</th><th>Confirmación</th></tr></thead>
    <tbody>${d.ads.map((a) => `<tr><td><span class="mono">${esc(a.ad)}</span></td><td><span class="mono muted">${esc(shortId(a.campaign))}</span></td>
      <td>${fmt(a.visitors)}</td><td>${fmt(a.submitters)}</td><td>${pct(crate(a))}</td><td>${fmt(a.confirmed)}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- Vista de un evento ---------- */
function eventView(ev) {
  const seg = segOf();
  const f = ev.funnel[seg];
  const pathsInfo = `Landing ${esc(ev.paths.landing)}`;
  return `
    ${plainSummary(ev)}
    ${kpis(ev)}
    ${section(1, "Embudo", `De visitante a confirmado. Cada columna es un paso; el color muestra qué tan bien pasa la gente al siguiente (verde bien, rojo mal). ${pathsInfo}.`,
      `<div class="card big">${funnelView(f)}</div>`)}
    ${section(2, "Anuncios de esta landing", "Qué anuncios traen gente que sí llena el formulario.",
      `<div class="card big">${ev.diagnosis ? adsChart(ev) : ""}</div>`)}
    ${section(3, "Test A/B", `Dos versiones de la misma landing, mostradas a personas distintas para ver cuál convierte más. Con ${prefs.paid ? "solo tráfico pago" : "todas las fuentes"}.`,
      abView(ev))}
    ${emailView(ev)}
    ${ev.diagnosis ? diagnosisView(ev) : ""}
    ${section(6, "Visitantes y conversión por día", "Cada columna es un día. Sirve para ver si algo subió o bajó después de un cambio.",
      `<div class="grid g2">
        <div class="card big"><div class="card-head"><h3>Visitantes por día</h3></div><div class="chart" id="c-visitors"></div></div>
        <div class="card big"><div class="card-head"><h3>% que llena el formulario</h3><span class="small muted">días con 20+ visitantes</span></div><div class="chart" id="c-rate"></div></div>
      </div>`)}
    ${section(7, "Fuentes de tráfico", "De dónde llega la gente.",
      `<div class="card big">${sourcesTable(ev.funnel.sources)}</div>`)}
    <div class="card glossary"><h3>Glosario</h3><dl>
      <dt>Conversión</dt><dd>De las personas de un paso, cuántas pasan al siguiente.</dd>
      <dt>Test A/B</dt><dd>Dos versiones de la landing. Gana la que convierte más con confianza suficiente (95%).</dd>
      <dt>Reparto roto</dt><dd>El tráfico no se divide como lo configuraste, así que la comparación no sirve.</dd>
      <dt>Apertura / Clics</dt><dd>Qué porcentaje de los destinatarios abrió el mail o hizo clic en un enlace.</dd>
      <dt>Bajas</dt><dd>Personas que pidieron dejar de recibir la secuencia.</dd>
      <dt>Tráfico pago</dt><dd>Visitas que llegan con parámetros de Meta (Facebook e Instagram).</dd>
    </dl></div>`;
}

function drawCharts(ev) {
  const seg = segOf();
  const rows = ev.funnel.daily;
  const cv = document.getElementById("c-visitors"), cr = document.getElementById("c-rate");
  if (!cv || !rows.length) return;
  const tipDay = (r) => `<b>${dayLabel(r.d)}</b><br>${fmt(r[seg].visitors)} visitantes<br>${fmt(r[seg].submitters)} formularios · ${pct(rate(r[seg].submitters, r[seg].visitors))}<br>${fmt(r[seg].confirmed)} confirmaciones`;
  colChart(cv, rows, { value: (r) => r[seg].visitors, label: (r) => dayLabel(r.d), tipFn: tipDay });
  // Días con menos de 20 visitantes no se grafican: un solo formulario dispara la tasa.
  lineChart(cr, rows, { value: (r) => r[seg].visitors >= 20 ? rate(r[seg].submitters, r[seg].visitors) : null, label: (r) => dayLabel(r.d), tipFn: tipDay });
}

function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach((el) => {
    el.addEventListener("pointermove", (e) => showTip(el.dataset.tip, e.clientX, e.clientY));
    el.addEventListener("pointerleave", hideTip);
  });
}

function render() {
  if (!store.get(TOKEN_STORE)) return renderGate();
  const ev = data && (data.events.find((e) => e.key === prefs.event) || data.events[0]);
  const daysBtns = [7, 14, 30, 90].map((d) => `<button type="button" data-days="${d}" aria-pressed="${prefs.days === d}">${d} días</button>`).join("");
  app.innerHTML = `
    <header class="top">
      <div class="brand"><span class="eyebrow">Highway Trading Academy</span><h1>Eventos: cómo va cada landing</h1>
        <p class="small muted">${data ? `Actualizado ${dateFmt(data.generatedAt, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} (hora Argentina)${data.cached ? " · desde caché" : ""}` : ""}</p></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Período">${daysBtns}</div>
        <label class="toggle"><input type="checkbox" id="paid" ${prefs.paid ? "checked" : ""}> Solo tráfico pago</label>
        <button class="btn" id="refresh" ${loading ? "disabled" : ""}>${loading ? "Actualizando…" : "Actualizar"}</button>
      </div>
    </header>
    ${data ? eventCards() : ""}
    ${lastError ? `<div class="card" style="margin-bottom:16px"><p class="err">No se pudieron cargar los datos: ${esc(lastError)}</p></div>` : ""}
    ${ev ? eventView(ev) : loading ? `<div class="loading">Consultando la analítica de Framer… (puede tardar unos segundos)</div>` : ""}
    ${data ? `<div class="notes">
      <p>Fuente: analítica de Framer del proyecto Eventos. Cada paso cuenta a quienes vieron la landing y después avanzaron ese mismo día.</p>
      <p>Confianza: test z de dos proporciones sobre la conversión a formulario, variante contra original. Se considera ganador desde 95%.</p>
      <p>Diagnóstico: Framer registra visitas, clics y formularios, pero no cuánto scrollea cada persona. Para eso sirve un mapa de calor (por ejemplo Microsoft Clarity, gratis).</p>
      <p>Sesión: ${esc(store.get(EMAIL_STORE) || "")} · <a href="#" id="logout" style="color:inherit">Cerrar sesión</a></p>
    </div>` : ""}`;

  app.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => { prefs.days = +b.dataset.days; savePrefs(); load(); }));
  app.querySelectorAll("[data-ev]").forEach((b) => b.addEventListener("click", () => { prefs.event = b.dataset.ev; savePrefs(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
  const paid = document.getElementById("paid");
  if (paid) paid.addEventListener("change", () => { prefs.paid = paid.checked; savePrefs(); render(); });
  const refresh = document.getElementById("refresh");
  if (refresh) refresh.addEventListener("click", () => load(true));
  const logout = document.getElementById("logout");
  if (logout) logout.addEventListener("click", (e) => { e.preventDefault(); store.del(TOKEN_STORE); data = null; renderGate(); });
  bindTips(app);
  if (ev) drawCharts(ev);
}

let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const ev = data && (data.events.find((e) => e.key === prefs.event) || data.events[0]); if (ev) drawCharts(ev); }, 150); });

load();
</script>
</body>
</html>
